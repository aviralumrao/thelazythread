<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Lazy Thread</title>
    <link rel="icon" href="images/logo.svg" type="image/x-icon">
    <link rel="shortcut icon" href="images/logo.svg" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <nav class="flexbox">
            <a class="logo flexbox" href="index.html">
                <img src="images/logo.svg" alt="The Lazy Thread Logo">
                <h1 class="logo-text">THE LAZY THREAD</h1>
            </a>
            <ul class="menu flexbox center">
                <li class="cousine-bold underline"><a href="index.html">Home</a></li>
                <li class="cousine-regular"><a href="about.html">About Us</a></li>
                <li class="cousine-regular"><a href="products.html">Products</a></li>
                <li class="cousine-regular"><a href="contact.html">Contact</a></li>
            </ul>
            <ul class="icons flexbox">
                <li><a href="cart.html">
                        <img src="images/bag.svg" alt="Cart Icon">
                    </a></li>
                <li><a href="account.html">
                        <img src="images/profile.svg" alt="Account Icon">
                    </a></li>
            </ul>
        </nav>
    </header>

    <div class="space-for-nav"></div>

    <div class="hero section">
        <div class="carousel container">
            <!-- The track that slides -->
            <div class="carousel-track">
                <div class="slide slide1">
                    <img src="images/banners/hero-banners/1.png" alt="">
                </div>
                <div class="slide slide2">Slide 2</div>
                <div class="slide slide3">Slide 3</div>
            </div>

            <!-- The synchronized dots -->
            <div class="carousel-dots">
                <span class="dot dot1"></span>
                <span class="dot dot2"></span>
                <span class="dot dot3"></span>
            </div>
        </div>
    </div>

    <div class="section">
        <h1 class="heading center">Categories</h1>
        <div class="categories container flexbox">
            <div class="card" onclick="window.location.href='products.html'">
                <img src="images/category/regularfit.jpg" alt="Mountain Landscape" class="card-image">
                <div class="card-content center">
                    <h2 class="sub-heading">Regular Fit</h2>
                    <p class="light-text">Lorem ipsum dolor sit amet consectetur, adipisicing elit. Accusantium necessitatibus nobis omnis saepe illum vitae ratione quisquam! Cum, placeat sint.</p>
                </div>
            </div>
        </div>

    </div>

</body>

</html>
